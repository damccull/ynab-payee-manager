[package]
name = "ynab-payee-rs"
version = "0.1.0"
authors = ["damccull <401104+damccull@users.noreply.github.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ynab-payee-rs"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde", "wasm-bindgen"] }
dioxus = { version = "0.7.1", features = ["router"] }
env = "1.0.1"
idb = "0.6.5"
reqwest = { version = "0.13.1", features = ["rustls", "json", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
thiserror = "2.0.18"
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3.85", features = [
  "Window",
  "Location",
  "UrlSearchParams",
  "History",
  "Storage",
] }
strsim = "0.11"
uuid = { version = "1.10", features = ["v4", "js", "serde"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
